# Render Static Site Blueprint for ChatHub
# Free tier compatible

services:
  - type: static
    name: chathub
    runtime: node
    buildCommand: pnpm install && pnpm --filter @workspace/chat-app run build
    publishDir: artifacts/chat-app/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APPWRITE_ENDPOINT
        value: https://sgp.cloud.appwrite.io/v1
      - key: VITE_APPWRITE_PROJECT_ID
        value: 6a2a14fd0026dd2c2de2
      - key: VITE_APPWRITE_DATABASE_ID
        value: 6a2a372b0016b73b5f21
      - key: NODE_ENV
        value: production
